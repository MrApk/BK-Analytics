<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}BK Analytics{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

<!-- ═══ SIDEBAR ═══════════════════════════════════════════════════════════ -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-crown">👑</span>
    <span class="brand-text">BK Analytics</span>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">OVERVIEW</div>
    <a href="{{ url_for('index') }}"
       class="nav-link-item {% if request.endpoint=='index' %}active{% endif %}">
      <i class="bi bi-house-fill"></i><span>Home</span>
    </a>
    <a href="{{ url_for('dashboard') }}"
       class="nav-link-item {% if request.endpoint=='dashboard' %}active{% endif %}">
      <i class="bi bi-bar-chart-fill"></i><span>Dashboard</span>
    </a>

    <div class="nav-section-label mt-3">AI CHAT</div>
    <a href="{{ url_for('chat_review') }}"
       class="nav-link-item {% if request.endpoint=='chat_review' %}active{% endif %}">
      <i class="bi bi-star-fill" style="color:#f97316"></i><span>Review Chat</span>
    </a>
    <a href="{{ url_for('chat_menu') }}"
       class="nav-link-item {% if request.endpoint=='chat_menu' %}active{% endif %}">
      <i class="bi bi-egg-fried" style="color:#22c55e"></i><span>Menu Chat</span>
    </a>
    <a href="{{ url_for('chat_order') }}"
       class="nav-link-item {% if request.endpoint=='chat_order' %}active{% endif %}">
      <i class="bi bi-bag-fill" style="color:#3b82f6"></i><span>Order Chat</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-footer-text">Powered by Google Gemini</div>
  </div>
</div>

<!-- ═══ TOPBAR ════════════════════════════════════════════════════════════ -->
<div class="topbar">
  <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
    <i class="bi bi-list"></i>
  </button>
  <div class="topbar-title">{% block page_title %}BK Analytics{% endblock %}</div>
  <div class="topbar-right">
    <span class="badge bg-danger">Live</span>
  </div>
</div>

<!-- ═══ MAIN CONTENT ══════════════════════════════════════════════════════ -->
<main class="main-content" id="mainContent">
  {% block content %}{% endblock %}
</main>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
<!-- Marked.js for markdown rendering in chat -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
  // Sidebar toggle
  const sidebar     = document.getElementById('sidebar');
  const mainContent = document.getElementById('mainContent');
  const topbar      = document.querySelector('.topbar');
  const toggleBtn   = document.getElementById('sidebarToggle');

  function toggleSidebar() {
    sidebar.classList.toggle('collapsed');
    mainContent.classList.toggle('expanded');
    topbar.classList.toggle('expanded');
  }

  toggleBtn.addEventListener('click', toggleSidebar);

  // Auto-collapse on mobile
  if (window.innerWidth < 768) {
    sidebar.classList.add('collapsed');
    mainContent.classList.add('expanded');
    topbar.classList.add('expanded');
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
