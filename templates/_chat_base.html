<!-- shared chat UI – included by each chat template -->
<div class="row justify-content-center">
  <div class="col-12 col-lg-9">

    <div class="d-flex align-items-center mb-4">
      <div class="fs-2 me-3">{{ icon }}</div>
      <div>
        <h2 class="fw-bold mb-0">{{ title }}</h2>
        <p class="text-muted mb-0 small">{{ subtitle }}</p>
      </div>
    </div>

    <!-- Chat window -->
    <div class="card shadow-sm mb-3">
      <div class="card-body chat-window p-3" id="chatWindow">
        <div class="chat-msg bot mb-3">
          <div class="bubble bot-bubble">
            👋 Hello! I'm your <strong>{{ title }}</strong> assistant.<br>{{ subtitle }}. Ask me anything!
          </div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <form id="chatForm" class="d-flex gap-2">
      <input type="hidden" id="chatPage" value="{{ page }}">
      <input type="text" id="msgInput" class="form-control"
             placeholder="Type your question…" autocomplete="off" required>
      <button type="submit" class="btn btn-danger px-4" id="sendBtn">
        <i class="bi bi-send-fill"></i>
      </button>
    </form>
    <p class="text-muted small mt-2">
      <i class="bi bi-info-circle"></i> Powered by Google Gemini with tool-calling. Answers are grounded in the dataset.
    </p>

  </div>
</div>

{% block scripts %}
<script>
const form      = document.getElementById('chatForm');
const input     = document.getElementById('msgInput');
const window_   = document.getElementById('chatWindow');
const page      = document.getElementById('chatPage').value;
const sendBtn   = document.getElementById('sendBtn');

function appendMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + role + ' mb-3';
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role === 'user' ? 'user-bubble' : 'bot-bubble');
  bubble.innerHTML = text.replace(/\n/g, '<br>');
  div.appendChild(bubble);
  window_.appendChild(div);
  window_.scrollTop = window_.scrollHeight;
}

function appendTyping() {
  const div = document.createElement('div');
  div.className = 'chat-msg bot mb-3';
  div.id = 'typing';
  div.innerHTML = '<div class="bubble bot-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
  window_.appendChild(div);
  window_.scrollTop = window_.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = input.value.trim();
  if (!msg) return;
  appendMsg(msg, 'user');
  input.value = '';
  sendBtn.disabled = true;
  appendTyping();
  try {
    const res = await fetch('/api/chat/' + page, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({msg})
    });
    const data = await res.json();
    document.getElementById('typing')?.remove();
    appendMsg(data.answer || data.error || 'Unknown error', 'bot');
  } catch(err) {
    document.getElementById('typing')?.remove();
    appendMsg('⚠️ Network error: ' + err.message, 'bot');
  }
  sendBtn.disabled = false;
  input.focus();
});
</script>
{% endblock %}
